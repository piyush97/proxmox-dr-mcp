[project]
name = "proxmox-dr-mcp"
version = "0.1.0"
description = "MCP server for automated Proxmox disaster recovery — pre-flight checks, smart snapshots, health verification, and rollback"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
proxmox-dr-mcp = "proxmox_dr_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxmox_dr_mcp"]
